[package]
name = "plant-saver"
version = "0.1.0"
authors = ["Guillaume Lamanda <guillaume.lamanda@gmail.com>"]
edition = "2024"

[profile.release]
opt-level = "s"
debug = true # Symbols don't go to flash; they let espflash decode backtraces
lto = true
codegen-units = 1

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.53", default-features = false, features = [
    "std",
    "binstart",
    "native",
    "embassy-time-driver",
    "experimental",
    "critical-section",
] }
anyhow = { version = "1", default-features = false }
rs-matter = { version = "0.4.1", default-features = false }
rs-matter-stack = { version = "0.3.1", default-features = false }
esp-idf-matter = "0.1"
static_cell = "2.1"
rand = "0.10"
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }

[build-dependencies]
embuild = "0.33.1"
