[package]
name = "plant-saver"
version = "0.1.0"
authors = ["Guillaume Lamanda <guillaume.lamanda@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.71"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[profile.test]

[features]
default = ["std", "esp-idf-svc/native"]
pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = { version = "0.4", default-features = false }
esp-idf-svc = { version = "0.52", default-features = false, features = [
    "embassy-time-driver",
    "experimental",
    "critical-section",
] }
anyhow = { version = "*", default-features = false }
rs-matter = { version = "=0.2.0", default-features = false }
rs-matter-stack = { version = "=0.1.0", default-features = false }
esp-idf-matter = { path = "vendor/esp-idf-matter" }
static_cell = "2.1"
rand = "0.8"
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }

[build-dependencies]
embuild = "0.33.1"

[patch.crates-io]
# Vendored from b1c8938: BLE GATT fix plus configurable Thread task stack.
# Re-evaluate when both fixes ship on crates.io.
esp-idf-svc = { path = "vendor/esp-idf-svc" }
