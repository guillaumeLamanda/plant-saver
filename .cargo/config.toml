[build]
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
  "--cfg",
  "espidf_time64",
] # Extending time_t for ESP IDF 5: https://github.com/esp-rs/rust/issues/110

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Forced: the firmware only supports the C6, and a stale MCU in the shell
# would otherwise silently build for another chip.
MCU = { value = "esp32c6", force = true }
ESP_IDF_VERSION = "v5.5.3"
