#:schema https://mise.en.dev/schema/mise.json
[tools]
"cargo:espflash" = "latest"
"rust" = { version = "nightly-2026-10-01", components = [
  "rust-src",
  "rustfmt",
  "clippy",
  "rust-analyzer",
], targets = [
  "riscv32imac-unknown-none-elf",
] }

[env]
MCU = "esp32c6"
ESP_IDF_TARGET = "esp32c6"
CARGO_BUILD_TARGET = "riscv32imac-esp-espidf"
ESPFLASH_PORT = "/dev/cu.usbmodem1101"

[tasks.build]
description = "Build the ESP32 firmware (debug)."
run = '''
cargo build # --features zeroconf
'''

[tasks.release]
description = "Build the ESP32 firmware (release)."
run = '''
cargo build --release
'''

[tasks.run]
description = "Build and flash firmware to ESP32."
depends = ["build"]
alias = 'dev'
run = '''
cargo run
'''

[tasks.monitor]
description = "Read serial output from ESP32 via espflash."
run = '''
espflash monitor
'''

[tasks.check]
description = "Check ESP32 target code compiles (fast)."
run = '''
cargo check
'''

[tasks.test]
description = "Run unit tests on host (no ESP hardware needed)."
run = '''
cargo test
'''

[tasks.clippy]
description = "Run clippy lints."
run = '''
cargo clippy
'''
