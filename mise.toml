#:schema https://mise.en.dev/schema/mise.json
# Single entry point for every workflow (local and CI).
# - The Rust toolchain comes from rust-toolchain.toml (read via the idiomatic
#   version file), so the nightly is pinned in one place only.
# - Cargo/ESP-IDF env (target, MCU, ESP_IDF_VERSION) lives in
#   .cargo/config.toml so plain `cargo` works too.
# - espflash auto-detects the ESP32-C6 serial port (its name changes with the
#   USB socket on macOS). To force one, set ESPFLASH_PORT under [env] in a
#   gitignored mise.local.toml.

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[tools]
# Prebuilt release binaries: `cargo install` from this repo would pick up the
# riscv target + build-std from .cargo/config.toml and fail.
"github:esp-rs/espflash" = "v4.7.0"
"github:esp-rs/embuild" = { version = "0.3.2", version_prefix = "ldproxy-v", bin = "ldproxy" }
# Git hooks (hk.pkl); hk evaluates its config with pkl.
hk ={ version = "2.12.0", workflow = "release.yml" }
pkl = "0.33.0"

[tasks.build]
description = "Build the firmware (debug)."
run = "cargo build"

[tasks.release]
description = "Build the firmware (release)."
run = "cargo build --release"

[tasks.check]
description = "Type-check the firmware (fast)."
run = "cargo check"

[tasks.clippy]
description = "Run clippy with the CI settings (warnings are errors)."
run = "cargo clippy --all-targets --all-features --workspace -- -D warnings"

[tasks.fmt]
description = "Format the code."
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting (CI)."
run = "cargo fmt --all -- --check"

[tasks."test:host"]
description = "Run the hardware-free unit tests (soil-moisture crate) on the host."
# .cargo/config.toml defaults to the riscv target with build-std; `--target`
# with the host triple (read from rustc, so macOS and Linux both work)
# overrides the target. build-std stays on and rebuilds std for the host,
# which works because rust-toolchain.toml installs rust-src.
run = 'cargo test -p soil-moisture --target "$(rustc -vV | sed -n "s/^host: //p")"'

[tasks.ci]
description = "Run every CI check locally: fmt, clippy, release build, host tests."
depends = ["fmt:check", "clippy", "release", "test:host"]

[tasks."hooks:install"]
description = "Install the hk git hooks (pre-commit: fmt; pre-push: fmt check + clippy)."
run = "hk install --mise"

[tasks.run]
description = "Build, flash to the ESP32-C6 and monitor (needs hardware)."
alias = "dev"
raw = true
run = "cargo run"

[tasks.monitor]
description = "Attach to the ESP32-C6 serial output (needs hardware)."
raw = true
run = "espflash monitor"

[tasks.test]
description = "Build tests, flash them to the ESP32-C6 and run on-device (needs hardware)."
raw = true
run = "cargo test"

[tasks."test:build"]
description = "Compile the on-device tests without flashing."
run = "cargo test --no-run"

[tasks.erase]
description = "Erase the whole flash, wiping Matter commissioning (needs hardware)."
run = "espflash erase-flash"
