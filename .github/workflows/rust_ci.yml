name: Continuous Integration

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # esp-idf-sys clones ESP-IDF from GitHub; the token avoids API rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same tasks as `mise run ci` locally.
        task: [release, "fmt:check", clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools (Rust from rust-toolchain.toml, espflash, ldproxy)
        uses: jdx/mise-action@v5
      - name: Cache cargo
        if: matrix.task != 'fmt:check'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - name: Cache ESP-IDF and its toolchain
        if: matrix.task != 'fmt:check'
        uses: actions/cache@v6
        with:
          path: .embuild
          key: embuild-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults', 'Cargo.lock') }}
          restore-keys: embuild-${{ runner.os }}-
      - name: Run task
        run: mise run ${{ matrix.task }}
