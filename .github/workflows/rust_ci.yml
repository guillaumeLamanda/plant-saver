name: Continuous Integration

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # esp-idf-sys clones ESP-IDF from GitHub; the token avoids API rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same tasks as `mise run ci` locally.
        task: [release, "fmt:check", clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tools (Rust from rust-toolchain.toml, espflash, ldproxy)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - name: Cache cargo
        if: matrix.task != 'fmt:check'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.task }}
      - name: Cache ESP-IDF and its toolchain
        if: matrix.task != 'fmt:check'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .embuild
          key: embuild-${{ runner.os }}-${{ hashFiles('.cargo/config.toml', 'sdkconfig.defaults', 'Cargo.lock') }}
          restore-keys: embuild-${{ runner.os }}-
      - name: Run task
        run: mise run ${{ matrix.task }}
